<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- World Cup 2026 Trophy Icon -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6B800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0033A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002266;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Trophy base -->
  <path fill="url(#goldGradient)" d="M512 100 L300 200 L300 300 L200 800 L250 800 L250 900 L374 900 L374 800 L644 800 L644 900 L768 900 L768 800 L824 800 L724 300 L724 200 Z"/>
  
  <!-- Trophy handles -->
