  <path fill="url(#goldGradient)" d="M844 400 Q874 500 724 550 L724 300 L824 300 Z"/>
  
  <!-- Soccer ball pattern -->
  <circle cx="512" cy="380" r="80" fill="url(#blueGradient)"/>
  <path fill="#FFFFFF" d="M460 380 C460 350 512 330 512 330 C512 330 564 350 564 380 C564 410 512 430 512 430 C512 430 460 410 460 380 Z" opacity="0.3"/>
  
  <!-- Text 2026 -->
  <text x="512" y="650" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="#0033A0" text-anchor="middle">2026</text>
</svg>