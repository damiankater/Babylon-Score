<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#1F4E8C"/>
  <g transform="translate(512, 480)">
    <!-- Ishtar Gate inspired arch -->
    <path fill="#C9A84C" d="M-120 -280 L-120 80 Q0 120 120 80 L120 -280 Z" opacity="0.15"/>
    <path fill="#C9A84C" d="M-80 -250 L-80 60 Q0 90 80 60 L80 -250 Z" opacity="0.25"/>
    <!-- Lion motif (simplified) -->
    <path fill="#C9A84C" d="M-60 -180 L-40 -220 L-20 -180 L0 -220 L20 -180 L40 -220 L60 -180
             L50 -140 L30 -120 L30 -80 L-30 -80 L-30 -120 L-50 -140 Z" opacity="0.6"/>
    <!-- Star of Ishtar -->
    <polygon fill="#C9A84C" points="0,-60 8,-20 45,-20 15,5 28,42 0,18 -28,42 -15,5 -45,-20 -8,-20" opacity="0.8"/>
    <!-- Award ribbon -->
    <path fill="#B85D3F" d="M-180 140 Q-160 120 -140 140 L-140 250 L-160 220 L-180 250 Z" opacity="0.5"/>
    <path fill="#B85D3F" d="M180 140 Q160 120 140 140 L140 250 L160 220 L180 250 Z" opacity="0.5"/>
    <!-- Text -->
    <text x="0" y="100" font-family="Georgia, serif" font-size="110" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BABYLON</text>
    <text x="0" y="170" font-family="Georgia, serif" font-size="90" font-weight="bold" fill="#C9A84C" text-anchor="middle">SCORE</text>
    <text x="0" y="210" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.7" text-anchor="middle">WORLD CUP 2026</text>
  </g>
</svg>
