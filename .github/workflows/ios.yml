name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Babylon Score IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Setup .NET 8 (LTS, Xcode 16 compatible)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Patch csproj for .NET 8 iOS build
        run: |
          sed -i '' 's/net10.0-ios/net8.0-ios/g' MauiApp1.csproj
          sed -i '' 's/net10.0-android/net8.0-android/g' MauiApp1.csproj
          sed -i '' 's/net10.0-maccatalyst/net8.0-maccatalyst/g' MauiApp1.csproj

      - name: Restore dependencies
        run: dotnet restore

      - name: Build iOS Release
        run: |
          dotnet publish -f net8.0-ios -c Release \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:CodesignKey='' \
            /p:CodesignProvision=''

      - name: Create IPA from .app bundle
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qq -r -9 BabylonScore.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabylonScore-iOS
          path: BabylonScore.ipa
          retention-days: 30
