name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Babylon Score IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 (LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin SDK via global.json and install MAUI
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet workload install maui

      - name: Patch project for .NET 8
        run: |
          sed -i '' 's/net10.0-ios/net8.0-ios/g' MauiApp1.csproj
          sed -i '' 's/net10.0-android/net8.0-android/g' MauiApp1.csproj
          sed -i '' 's/net10.0-maccatalyst/net8.0-maccatalyst/g' MauiApp1.csproj
          sed -i '' 's/net10.0-windows10.0.19041.0/net8.0-windows10.0.19041.0/g' MauiApp1.csproj
          sed -i '' 's/Version="10.0.0"/Version="8.0.0"/g' MauiApp1.csproj

      - name: Restore
        run: dotnet restore

      - name: Build iOS Release
        run: |
          dotnet publish -f net8.0-ios -c Release \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:CodesignKey="-" \
            /p:CodesignProvision=""

      - name: Create IPA
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qq -r -9 BabylonScore.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabylonScore-iOS
          path: BabylonScore.ipa
          retention-days: 30
